<svg viewBox="0 0 200 200" stroke="#282828" fill="#282828" xmlns="http://www.w3.org/2000/svg">
  
  <style>
    :root {
      --square-size: 78px;
      --stroke-width: 16px;
      --line-offset: 10px;
    }
    .rect {
      rx: 14px; ry: 14px;
      width: var(--square-size); height: var(--square-size);
      stroke-width: var(--stroke-width);
      fill: none;
    }
    .rect.top-left {
      x: 0;
      y: 0;
      translate: calc(var(--stroke-width) / 2) calc(var(--stroke-width) / 2);
    }
    .rect.bottom-left {
      x: 0;
      y: calc(200px - var(--square-size));
      translate: calc(var(--stroke-width) / 2) calc(-1 * var(--stroke-width) / 2);
    }
    .rect.bottom-right {
      x: calc(200px - var(--square-size));
      y: calc(200px - var(--square-size));
      translate: calc(-1 * var(--stroke-width) / 2) calc(-1 * var(--stroke-width) / 2);
    }
    .line {
      stroke: none;
    }
    .line.horizontal {
      x: calc(200px - var(--square-size) - var(--stroke-width) / 2);
      width: calc(var(--square-size));
      y: calc((var(--square-size)) / 2);
      height: var(--stroke-width);
    }
    .line.vertical {
      x: calc(200px - var(--square-size) / 2 - var(--stroke-width));
      width: var(--stroke-width);
      y: calc(var(--stroke-width) / 2);
      height: var(--square-size);
    }
  </style>
  
  
  <rect class="rect top-left"/>
  <rect class="rect bottom-left"/>
  <rect class="rect bottom-right"/>
  
  <rect class="line horizontal"/>
  <rect class="line vertical"/>
    
</svg>