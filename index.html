<!doctype html>
<html lang="en-US">
<head>
  <meta charset="UTF-8"/>
  
  <title>Kupidon - date app</title>
  <meta
    name="description"
    content="Kupidon is a dating and relationship app. We offer users a selection of date ideas and places to make their meetings unforgettable."
  />
  
  
  <meta name="viewport"
    content="width=device-width, height=device-height,
    viewport-fit=cover, shrink-to-fit=no,
    interactive-widget=resizes-content,
    initial-scale=1, maximum-scale=1, user-scalable=0"
  />
  
  
  <!-- There is png because iOS does not support svg -->
  <link rel="icon" type="image/png" href="%BASE_URL%public/res/icon64.png"/>
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%public/res/icon.svg"/>
  <!-- Используется как иконка PWA на iOS -->
  <link rel="apple-touch-icon" type="image/png" href="%BASE_URL%public/res/icon192-padding.png"/>
  
  
  <!--
    manifest.json provides metadata used when your web app is installed on a
    user's mobile device or desktop.
    See https://developers.google.com/web/fundamentals/web-app-manifest/
  -->
  <link rel="manifest" href="%BASE_URL%manifest.json">
  
  
  <!-- Used as color of mobile browser toolbar in site mode -->
  <!-- Do not set it if use media="(prefers-color-scheme: ...)" -->
  <!--<meta name="theme-color" content="green"/>-->
  
  <!-- works on site in mobile Chrome -->
  <!-- works in app on desktop Edge -->
  <!-- works in app on mobile Chrome -->
  <!-- works in app on mobile iOS Safari -->
  <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)"/>
  <!-- NOT works on site in mobile Chrome -->
  <!-- works in app on desktop Edge -->
  <!-- works in app on mobile Chrome -->
  <!-- works in app on mobile iOS Safari -->
  <meta name="theme-color" content="#282c34" media="(prefers-color-scheme: dark)"/>
  
  <script>
    /** @type {'development' | 'production' | string} */
    const MODE = "%MODE%"
    /** @type {string} */
    const BASE_URL = "%BASE_URL%"
  </script>
  
  <script type="application/javascript" src="%BASE_URL%public/scripts/array-toSorted-polyfill.js"></script>
  
  <script type="application/javascript" src="%BASE_URL%public/scripts/array-toSpliced-polyfill.js"></script>
  
  <script type="application/javascript" src="%BASE_URL%public/scripts/apply-lang-to-html.js"></script>
  
  <script type="application/javascript" src="%BASE_URL%public/scripts/apply-saved-lang.js"></script>
  
  <script type="application/javascript" src="%BASE_URL%public/scripts/app-installation-check.js"></script>
  
  
</head>
<body>

  <div id="root"></div>
  <div id="modal-outlet" style="display: contents;"></div>
  
  <script type="module" src="/src/main.tsx"></script>

</body>
</html>
